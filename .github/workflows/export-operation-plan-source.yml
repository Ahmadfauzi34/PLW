name: Export operation plan source

on:
  push:
    branches:
      - operation-plan-preflight-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified runtime source
        run: bash scripts/unpack_runtime_source.sh
      - name: Export exact planning source
        run: |
          mkdir -p artifacts/operation-plan/core artifacts/operation-plan/skills
          cp plw_cli.py hott_kernel.py artifacts/operation-plan/
          cp core/semantic_affordance.py core/capability_selection.py core/portable_agent.py core/agent_communication.py core/operation_plan.py artifacts/operation-plan/core/
          cp skills/semantic-affordance-workflow.md artifacts/operation-plan/skills/
          (
            cd artifacts/operation-plan
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: operation-plan-current-source
          path: artifacts/operation-plan
          if-no-files-found: error
