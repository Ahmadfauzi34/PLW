name: Export current runtime source candidate handoff

on:
  push:
    branches:
      - candidate-selection-agent-handoff-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Unpack verified runtime source and overlays
        run: bash scripts/unpack_runtime_source.sh

      - name: Record exact source identity
        shell: bash
        run: |
          mkdir -p artifacts/current-runtime
          git rev-parse HEAD > artifacts/current-runtime/HEAD_SHA.txt
          cp plw_cli.py artifacts/current-runtime/
          cp hott_kernel.py artifacts/current-runtime/
          cp -a core artifacts/current-runtime/core
          cp -a skills artifacts/current-runtime/skills
          find artifacts/current-runtime -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifacts/current-runtime/SHA256SUMS.txt

      - name: Upload exact current runtime source
        uses: actions/upload-artifact@v4
        with:
          name: candidate-selection-agent-handoff-current-runtime
          path: artifacts/current-runtime
          if-no-files-found: error
