name: Review JS/TS mutation boundary contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/review-js-ts-mutation-boundary-contract.yml"
      - "qualification/js_ts_v2_mutation_boundary_contract.json"
      - "scripts/review_js_ts_boolean_guard_mutation_boundary_contract.py"
      - "docs/JS_TS_V2_MUTATION_BOUNDARY_CONTRACT.md"

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify planner promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/planner-promotion
          python - <<'PY' > evidence/prerequisite.tsv
          import json
          from pathlib import Path
          data = json.loads(Path('qualification/js_ts_v2_mutation_boundary_contract.json').read_text())
          p = data['prerequisite']
          print('\t'.join([
              str(p['planner_promotion_workflow_run_id']),
              p['planner_promotion_artifact_name'],
              p['planner_promotion_artifact_digest'],
          ]))
          PY
          IFS=$'\t' read -r run_id artifact_name expected_digest < evidence/prerequisite.tsv
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > evidence/planner-promotion-meta.json
          actual_digest="$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .digest' evidence/planner-promotion-meta.json)"
          test -n "$actual_digest"
          test "$actual_digest" = "$expected_digest"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir evidence/planner-promotion
          echo "PLANNER_PROMOTION_EVIDENCE_VERIFIED $actual_digest"

      - name: Run contract fail-closed self-check
        run: |
          python scripts/review_js_ts_boolean_guard_mutation_boundary_contract.py \
            --contract qualification/js_ts_v2_mutation_boundary_contract.json \
            --promotion-report evidence/planner-promotion/synthesis/report.json \
            --self-check

      - name: Review mutation boundary contract
        run: |
          mkdir -p evidence/review
          python scripts/review_js_ts_boolean_guard_mutation_boundary_contract.py \
            --contract qualification/js_ts_v2_mutation_boundary_contract.json \
            --promotion-report evidence/planner-promotion/synthesis/report.json \
            --output evidence/review/report.json \
            --summary evidence/review/summary.md
          cat evidence/review/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert contract does not grant mutation authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/review/report.json').read_text())
          assert report['status'] == 'MUTATION_BOUNDARY_CONTRACT_REVIEW_PASSED'
          assert report['boundary']['authorization_is_external_and_candidate_specific'] is True
          assert report['boundary']['execution_environment'] == 'DISPOSABLE_TEMP_WORKTREE_ONLY'
          assert report['boundary']['exact_plan_application_only'] is True
          assert report['boundary']['primary_worktree_forbidden'] is True
          assert report['boundary']['rollback_strategy'] == 'DISCARD_DISPOSABLE_WORKTREE'
          assert report['boundary']['postconditions_required'] is True
          assert report['boundary']['append_only_receipt_required'] is True
          assert report['authority']['effectful_adapter_implemented'] is False
          assert report['authority']['source_mutation_authority_granted'] is False
          assert report['authority']['automatic_patch_authority_granted'] is False
          assert report['authority']['upstream_mutation_authorized'] is False
          assert report['next_gate'] == 'TEMP_WORKTREE_MUTATION_ADAPTER_REFERENCE'
          print('BOOLEAN_GUARD_MUTATION_BOUNDARY_CONTRACT: PASS')
          PY

      - name: Upload contract review evidence
        uses: actions/upload-artifact@v4
        with:
          name: js-ts-v2-mutation-boundary-contract-review
          path: |
            evidence/review/report.json
            evidence/review/summary.md
            evidence/planner-promotion-meta.json
          if-no-files-found: error
